<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movies - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .genre-filter-bar {
      display: flex;
      gap: 0.65rem;
      overflow-x: auto;
      padding: 1.5rem 0 2rem;
      scrollbar-width: none;
    }
    .genre-filter-bar::-webkit-scrollbar { display: none; }
    .genre-pill {
      padding: 0.55rem 1.25rem;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all var(--transition-fast);
      cursor: pointer;
    }
    .genre-pill:hover,
    .genre-pill.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand-logo">
        <svg class="logo-icon" viewBox="0 0 24 24"><path d="M4 2v20l16-10L4 2z"/></svg>
        STREAM<span>FLIX</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.html" class="active">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="movies.html?category=popular">New & Popular</a></li>
        <li><a href="my-list.html">My List</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="search.html" class="nav-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <button class="nav-kids-badge">KIDS</button>
      <div class="nav-profile-wrapper">
        <div class="profile-avatar-btn">
          <div class="profile-avatar-img"></div>
          <span style="font-size: 0.75rem;">▼</span>
        </div>
        <div class="profile-dropdown">
          <div class="profile-dropdown-header">
            <div class="profile-dropdown-name">Member</div>
          </div>
          <a href="profiles.html" class="profile-dropdown-item">Profiles</a>
          <a href="settings.html" class="profile-dropdown-item">Settings</a>
          <div class="profile-dropdown-divider"></div>
          <button class="profile-dropdown-item" onclick="AuthService.logout()">Sign Out</button>
        </div>
      </div>
      <div class="mobile-menu-btn"><span></span><span></span><span></span></div>
    </div>
  </header>

  <!-- Spotlight Banner -->
  <section class="hero" id="moviesSpotlight" style="min-height: 55vh;">
    <div class="hero-overlay"></div>
    <div class="container">
      <div class="hero-content">
        <div class="hero-badge-row">
          <span class="badge-pill featured">SPOTLIGHT MOVIE</span>
        </div>
        <h1 class="hero-title" id="spotlightTitle" style="font-size: 2.8rem;">Featured Film</h1>
        <p class="hero-plot" id="spotlightPlot" style="-webkit-line-clamp: 2;">Loading film information...</p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="spotlightPlayBtn">▶ Play</button>
          <button class="btn btn-secondary" id="spotlightInfoBtn">ⓘ Details</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Catalog Section -->
  <main class="container" style="padding-top: 1rem; padding-bottom: 5rem;">
    <div class="genre-filter-bar">
      <button class="genre-pill active" data-genre="all">All Movies</button>
      <button class="genre-pill" data-genre="action">Action</button>
      <button class="genre-pill" data-genre="scifi">Sci-Fi</button>
      <button class="genre-pill" data-genre="comedy">Comedy</button>
      <button class="genre-pill" data-genre="drama">Drama</button>
      <button class="genre-pill" data-genre="horror">Horror</button>
      <button class="genre-pill" data-genre="thriller">Thriller</button>
      <button class="genre-pill" data-genre="romance">Romance</button>
      <button class="genre-pill" data-genre="animation">Animation</button>
      <button class="genre-pill" data-genre="indian">Indian</button>
      <button class="genre-pill" data-genre="hollywood">Hollywood</button>
    </div>

    <div id="moviesCatalogContainer">
      <!-- Injected by movies.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-disclaimer">
        StreamFlix demonstration streaming platform powered by OMDb API.
      </div>
    </div>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/discovery.js"></script>
  <script src="./js/videoSources.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profiles.js"></script>
  <script src="./js/watchlist.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/recommendations.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/movies.js"></script>
</body>
</html>
