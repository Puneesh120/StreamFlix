<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch History - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .history-header {
      padding-top: calc(var(--header-height) + 2rem);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-bottom: 5rem;
    }
    .history-item-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      transition: background var(--transition-fast);
    }
    .history-item-row:hover {
      background: var(--bg-elevated);
    }
    .history-poster {
      width: 70px;
      height: 105px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: #252525;
      flex-shrink: 0;
    }
    .history-info {
      flex: 1;
    }
    .history-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.35rem;
    }
    .history-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.6rem;
    }
    .history-progress-track {
      width: 100%;
      max-width: 320px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 0.4rem;
    }
    .history-progress-fill {
      height: 100%;
      background: var(--accent-red);
    }
    .history-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    @media (max-width: 600px) {
      .history-item-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .history-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand-logo">
        <svg class="logo-icon" viewBox="0 0 24 24"><path d="M4 2v20l16-10L4 2z"/></svg>
        STREAM<span>FLIX</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="my-list.html">My List</a></li>
        <li><a href="history.html" class="active">History</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="search.html" class="nav-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <button class="nav-kids-badge">KIDS</button>
      <div class="nav-profile-wrapper">
        <div class="profile-avatar-btn">
          <div class="profile-avatar-img"></div>
        </div>
        <div class="profile-dropdown">
          <a href="profiles.html" class="profile-dropdown-item">Profiles</a>
          <a href="settings.html" class="profile-dropdown-item">Settings</a>
          <div class="profile-dropdown-divider"></div>
          <button class="profile-dropdown-item" onclick="AuthService.logout()">Sign Out</button>
        </div>
      </div>
      <div class="mobile-menu-btn"><span></span><span></span><span></span></div>
    </div>
  </header>

  <main class="container">
    <div class="history-header">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 0.25rem;">Watch History</h1>
        <p style="color: var(--text-secondary);" id="historyCount">Track your recently watched movies and series progress.</p>
      </div>
      <button class="btn btn-outline" id="clearHistoryBtn" style="font-size: 0.88rem; padding: 0.5rem 1.25rem;">Clear Entire History</button>
    </div>

    <div class="history-list" id="historyList">
      <!-- Injected by history controller -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-disclaimer">
        StreamFlix saves your playback progress in local browser storage for automatic resume.
      </div>
    </div>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/discovery.js"></script>
  <script src="./js/videoSources.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profiles.js"></script>
  <script src="./js/watchlist.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/recommendations.js"></script>
  <script src="./js/app.js"></script>

  <script>
    function renderHistory() {
      const history = HistoryService.getHistory();
      const container = document.getElementById('historyList');
      const countEl = document.getElementById('historyCount');

      countEl.textContent = `${history.length} title${history.length === 1 ? '' : 's'} recorded`;

      if (!history || history.length === 0) {
        container.innerHTML = `
          <div class="state-container">
            <div class="state-icon">🕒</div>
            <h2 class="state-title">No Watch History Yet</h2>
            <p class="state-text">Titles you start playing will appear here with saved progress so you can resume anytime.</p>
            <a href="index.html" class="btn btn-primary">Start Watching</a>
          </div>
        `;
        return;
      }

      container.innerHTML = history.map(item => {
        const title = Utils.sanitizeHtml(item.title);
        const poster = (item.poster && item.poster !== 'N/A') ? item.poster : Utils.getPlaceholderPoster(title);
        const pct = item.percentage || 0;
        const currentStr = Utils.formatTime(item.currentTime || 0);
        const totalStr = Utils.formatTime(item.duration || 0);

        return `
          <div class="history-item-row fade-in">
            <img class="history-poster" src="${poster}" alt="${title}" onerror="Utils.handleImageError(this, '${title.replace(/'/g, "\\'")}')" />
            <div class="history-info">
              <div class="history-title">${title}</div>
              <div class="history-meta">${item.year} • ${item.type.toUpperCase()} • Last watched ${new Date(item.timestamp).toLocaleDateString()}</div>
              <div class="history-progress-track">
                <div class="history-progress-fill" style="width: ${pct}%;"></div>
              </div>
              <div style="font-size: 0.78rem; color: var(--text-muted);">${currentStr} of ${totalStr} (${pct}%)</div>
            </div>
            <div class="history-actions">
              <a href="watch.html?id=${item.imdbID}" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.88rem;">Resume ▶</a>
              <button class="btn btn-circle" title="Remove from history" onclick="removeHistoryItem('${item.imdbID}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeHistoryItem(imdbId) {
      HistoryService.remove(imdbId);
      renderHistory();
    }

    document.getElementById('clearHistoryBtn').onclick = () => {
      if (confirm('Are you sure you want to clear your entire watch history?')) {
        HistoryService.clear();
        renderHistory();
      }
    };

    window.addEventListener('DOMContentLoaded', renderHistory);
  </script>
</body>
</html>
