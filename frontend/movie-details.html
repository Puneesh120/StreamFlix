<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Details - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .details-hero {
      position: relative;
      min-height: 65vh;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      padding-top: var(--header-height);
    }
    .details-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 3rem;
      margin-top: -8rem;
      position: relative;
      z-index: 10;
      padding-bottom: 5rem;
    }
    .poster-column {
      position: relative;
    }
    .details-poster-card {
      width: 100%;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: var(--bg-card);
    }
    .details-actions-panel {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .ratings-row {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;
    }
    .rating-item {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 0.8rem 1.2rem;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 140px;
    }
    .rating-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .rating-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-white);
    }
    .rating-value span {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
    }
    .rating-votes {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .user-feedback-section {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin: 2rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .star-rating-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .star-btn {
      font-size: 1.6rem;
      color: #555;
      transition: color var(--transition-fast), transform var(--transition-fast);
      cursor: pointer;
    }
    .star-btn:hover,
    .star-btn.active {
      color: #f5c518;
      transform: scale(1.15);
    }
    .meta-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }
    .meta-table td {
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }
    .meta-table td.label {
      width: 140px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .meta-table td.val {
      color: var(--text-primary);
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 900px) {
      .details-layout {
        grid-template-columns: 1fr;
        margin-top: 1rem;
      }
      .poster-column {
        max-width: 260px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand-logo">
        <svg class="logo-icon" viewBox="0 0 24 24"><path d="M4 2v20l16-10L4 2z"/></svg>
        STREAM<span>FLIX</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="my-list.html">My List</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="search.html" class="nav-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <button class="nav-kids-badge">KIDS</button>
      <div class="nav-profile-wrapper">
        <div class="profile-avatar-btn">
          <div class="profile-avatar-img"></div>
          <span style="font-size: 0.75rem;">▼</span>
        </div>
        <div class="profile-dropdown">
          <a href="profiles.html" class="profile-dropdown-item">Profiles</a>
          <a href="settings.html" class="profile-dropdown-item">Settings</a>
          <div class="profile-dropdown-divider"></div>
          <button class="profile-dropdown-item" onclick="AuthService.logout()">Sign Out</button>
        </div>
      </div>
      <div class="mobile-menu-btn"><span></span><span></span><span></span></div>
    </div>
  </header>

  <!-- Backdrop -->
  <div class="details-hero" id="detailsBackdrop">
    <div class="hero-overlay"></div>
  </div>

  <!-- Content -->
  <main class="container" id="detailsContent">
    <div class="details-layout">
      <!-- Poster Column -->
      <div class="poster-column">
        <img id="detailsPoster" class="details-poster-card" src="" alt="Movie Poster" />
        <div class="details-actions-panel">
          <button class="btn btn-primary" id="detailsPlayBtn" style="width: 100%;">▶ Play</button>
          <button class="btn btn-secondary" id="detailsListBtn" style="width: 100%;">+ Add to My List</button>
        </div>
      </div>

      <!-- Details Column -->
      <div class="info-column">
        <div class="hero-badge-row">
          <span class="badge-pill" id="detailsRated">NR</span>
          <span class="badge-pill" id="detailsYear"></span>
          <span class="badge-pill" id="detailsRuntime"></span>
          <span id="detailsGenre" style="color: var(--text-secondary); font-size: 0.88rem;"></span>
        </div>

        <h1 id="detailsTitle" style="font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 800; color: #fff; margin-bottom: 1rem;"></h1>

        <!-- Ratings Row from OMDb -->
        <div class="ratings-row" id="ratingsBreakdown"></div>

        <!-- Synopsis -->
        <h3 style="color: #fff; margin-top: 1.5rem; margin-bottom: 0.5rem;">Synopsis</h3>
        <p id="detailsPlot" style="font-size: 1.05rem; line-height: 1.7; color: #ddd;"></p>

        <!-- User Feedback Section -->
        <div class="user-feedback-section">
          <div>
            <div id="userRatingText" style="font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem;">Your Rating</div>
            <div class="star-rating-box" id="userStarRating">
              <button class="star-btn" data-star="1">☆</button>
              <button class="star-btn" data-star="2">☆</button>
              <button class="star-btn" data-star="3">☆</button>
              <button class="star-btn" data-star="4">☆</button>
              <button class="star-btn" data-star="5">☆</button>
            </div>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <button class="btn btn-circle" id="likeBtn" title="I Like this">❤️</button>
            <button class="btn btn-circle" id="dislikeBtn" title="Not for me">👎</button>
          </div>
        </div>

        <!-- Details Metadata Table -->
        <table class="meta-table">
          <tr id="detailsSeasonsRow" style="display: none;">
            <td class="label">Seasons</td>
            <td class="val" id="detailsTotalSeasons"></td>
          </tr>
          <tr>
            <td class="label">Director</td>
            <td class="val" id="detailsDirector"></td>
          </tr>
          <tr>
            <td class="label">Writers</td>
            <td class="val" id="detailsWriter"></td>
          </tr>
          <tr>
            <td class="label">Cast</td>
            <td class="val" id="detailsActors"></td>
          </tr>
          <tr>
            <td class="label">Awards</td>
            <td class="val" id="detailsAwards"></td>
          </tr>
          <tr>
            <td class="label">Languages</td>
            <td class="val" id="detailsLanguage"></td>
          </tr>
          <tr>
            <td class="label">Country</td>
            <td class="val" id="detailsCountry"></td>
          </tr>
        </table>

        <!-- Related Titles -->
        <div style="margin-top: 3.5rem;">
          <h3 style="color: #fff; font-size: 1.4rem; margin-bottom: 0.5rem;">More Like This</h3>
          <div class="related-grid" id="relatedGrid"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-disclaimer">
        StreamFlix movie details powered strictly by real OMDb API data. No generated or fake ratings.
      </div>
    </div>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/discovery.js"></script>
  <script src="./js/videoSources.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profiles.js"></script>
  <script src="./js/watchlist.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/recommendations.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/details.js"></script>
</body>
</html>
