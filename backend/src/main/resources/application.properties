# StreamFlix Server Configuration
server.port=${PORT:8080}

# OMDb API Configuration
# Defaults to active demo key 'trilogy' if OMDB_API_KEY is not set in the environment
omdb.api.key=${OMDB_API_KEY:trilogy}
omdb.api.url=https://www.omdbapi.com/

# CORS Configuration (Allows all localhost/127.0.0.1 ports and configured FRONTEND_URL)
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

# Spring Boot Configuration
spring.main.banner-mode=off
spring.mvc.async.request-timeout=20000

# Static Resources
spring.web.resources.static-locations=classpath:/static/
