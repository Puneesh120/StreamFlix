<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/player.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .trailer-iframe-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    .player-wrapper.trailer-mode .player-overlay {
      pointer-events: none !important;
      background: none !important;
      z-index: 10;
    }
    .player-wrapper.trailer-mode .player-header {
      pointer-events: auto !important;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
      z-index: 20;
    }
    .player-wrapper.trailer-mode .player-back-btn {
      pointer-events: auto !important;
      cursor: pointer;
    }
    .player-wrapper.trailer-mode .player-bottom-bar {
      display: none !important;
    }
    .player-wrapper.trailer-mode .player-center-action {
      display: none !important;
    }
  </style>
</head>
<body style="background-color: #000; overflow: hidden;">

  <div class="player-wrapper" id="playerWrapper">
    <!-- Main HTML5 Video (For direct MP4s) -->
    <video class="video-element" id="mainVideo" playsinline preload="metadata" style="display: none;"></video>

    <!-- Embedded Trailer Player (YouTube official trailer) -->
    <iframe class="trailer-iframe-container" id="trailerIframe" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="display: none;"></iframe>

    <!-- Center Play/Pause indicator -->
    <div class="player-center-action" id="centerAction">▶</div>

    <!-- Fallback Unavailable Banner -->
    <div class="player-unavailable-banner" id="unavailableBanner" style="display: none;">
      <h2 class="unavailable-title">Trailer Currently Loading...</h2>
      <p class="unavailable-desc" id="unavailableDesc">Preparing official high-definition preview.</p>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <button class="btn btn-secondary" onclick="window.history.back()">Back to Browse</button>
      </div>
    </div>

    <!-- Player Controls Overlay (For HTML5 MP4 videos) -->
    <div class="player-overlay" id="playerOverlay">
      <!-- Top Bar -->
      <div class="player-header">
        <button class="player-back-btn" id="backBtn">
          <span>&larr;</span> Back
        </button>
        <div class="player-title-display" id="playerTitle">Loading Title...</div>
        <div style="width: 80px;"></div>
      </div>

      <!-- Bottom Bar (Visible on MP4 mode) -->
      <div class="player-bottom-bar" id="playerBottomBar">
        <!-- Scrubber Progress Bar -->
        <div class="progress-container" id="progressContainer">
          <div class="progress-track">
            <div class="progress-buffered" id="bufferedBar"></div>
            <div class="progress-current" id="progressBar">
              <div class="progress-thumb"></div>
            </div>
          </div>
        </div>

        <!-- Controls Row -->
        <div class="controls-row">
          <div class="controls-left">
            <button class="ctrl-btn" id="playBtn" title="Play/Pause (Space)">▶</button>
            <button class="ctrl-btn" id="skipBackBtn" title="Skip -10s (&larr;)">&#x21BA; 10</button>
            <button class="ctrl-btn" id="skipForwardBtn" title="Skip +10s (&rarr;)">&#x21BB; 10</button>

            <!-- Volume -->
            <div class="volume-group">
              <button class="ctrl-btn" id="volumeBtn" title="Mute (M)">🔊</button>
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
            </div>

            <!-- Time Display -->
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
          </div>

          <div class="controls-right">
            <!-- Playback Speed -->
            <div class="player-menu-wrapper">
              <button class="ctrl-btn" id="speedBtn" title="Playback Speed" style="font-size: 0.95rem; font-weight: 700;">1x</button>
              <div class="player-menu" id="speedMenu">
                <div class="player-menu-option" data-speed="0.5">0.5x</div>
                <div class="player-menu-option" data-speed="0.75">0.75x</div>
                <div class="player-menu-option selected" data-speed="1">1x (Normal)</div>
                <div class="player-menu-option" data-speed="1.25">1.25x</div>
                <div class="player-menu-option" data-speed="1.5">1.5x</div>
                <div class="player-menu-option" data-speed="2">2x</div>
              </div>
            </div>

            <!-- Picture-in-Picture -->
            <button class="ctrl-btn" id="pipBtn" title="Picture in Picture">⧉</button>

            <!-- Fullscreen -->
            <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen (F)">⛶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/videoSources.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/player.js"></script>
</body>
</html>
