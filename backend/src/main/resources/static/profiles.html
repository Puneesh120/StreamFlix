<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who's Watching? - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .profiles-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, #1f1f1f 0%, #0d0d0d 100%);
    }
    .profiles-title {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 2.5rem;
    }
    .profiles-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
      margin-bottom: 3.5rem;
    }
    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      cursor: pointer;
      transition: transform var(--transition-fast);
      width: 140px;
    }
    .profile-card:hover {
      transform: scale(1.08);
    }
    .profile-avatar-large {
      width: 130px;
      height: 130px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: #fff;
      box-shadow: var(--shadow-md);
      border: 3px solid transparent;
      transition: border-color var(--transition-fast);
      position: relative;
    }
    .profile-card:hover .profile-avatar-large,
    .profile-card.active .profile-avatar-large {
      border-color: #fff;
    }
    .profile-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: color var(--transition-fast);
    }
    .profile-card:hover .profile-name,
    .profile-card.active .profile-name {
      color: #fff;
    }
    .profile-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: #2196f3;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.2rem 0.45rem;
      border-radius: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="profiles-screen">
    <a href="index.html" class="brand-logo" style="margin-bottom: 2rem; font-size: 2rem;">
      STREAM<span>FLIX</span>
    </a>

    <h1 class="profiles-title">Who's watching?</h1>

    <div class="profiles-grid" id="profilesContainer">
      <!-- Injected by script -->
    </div>

    <div style="display: flex; gap: 1rem;">
      <a href="index.html" class="btn btn-outline" style="letter-spacing: 0.05em; padding: 0.65rem 2rem;">Browse All</a>
      <a href="settings.html" class="btn btn-secondary" style="padding: 0.65rem 2rem;">Manage Settings</a>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profiles.js"></script>

  <script>
    function renderProfiles() {
      const container = document.getElementById('profilesContainer');
      const profiles = ProfilesService.getProfiles();
      const active = ProfilesService.getActiveProfile();

      const icons = {
        'p1': '👤',
        'p2': '🎬',
        'pkids': '🎈'
      };

      container.innerHTML = profiles.map(p => {
        const isActive = active && active.id === p.id;
        const icon = icons[p.id] || '🍿';
        return `
          <div class="profile-card ${isActive ? 'active' : ''}" onclick="selectProfile('${p.id}')">
            <div class="profile-avatar-large" style="background-color: ${p.avatarColor};">
              ${icon}
              ${p.isKids ? '<span class="profile-badge">Kids Mode</span>' : ''}
            </div>
            <div class="profile-name">${Utils.sanitizeHtml(p.name)}</div>
          </div>
        `;
      }).join('');
    }

    function selectProfile(id) {
      ProfilesService.setActiveProfile(id);
      window.location.href = 'index.html';
    }

    window.addEventListener('DOMContentLoaded', renderProfiles);
  </script>
</body>
</html>
