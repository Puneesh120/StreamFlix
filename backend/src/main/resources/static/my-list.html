<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My List - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .list-header {
      padding-top: calc(var(--header-height) + 2rem);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
      padding-bottom: 5rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand-logo">
        <svg class="logo-icon" viewBox="0 0 24 24"><path d="M4 2v20l16-10L4 2z"/></svg>
        STREAM<span>FLIX</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="my-list.html" class="active">My List</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="search.html" class="nav-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <button class="nav-kids-badge">KIDS</button>
      <div class="nav-profile-wrapper">
        <div class="profile-avatar-btn">
          <div class="profile-avatar-img"></div>
        </div>
        <div class="profile-dropdown">
          <a href="profiles.html" class="profile-dropdown-item">Profiles</a>
          <a href="settings.html" class="profile-dropdown-item">Settings</a>
          <div class="profile-dropdown-divider"></div>
          <button class="profile-dropdown-item" onclick="AuthService.logout()">Sign Out</button>
        </div>
      </div>
      <div class="mobile-menu-btn"><span></span><span></span><span></span></div>
    </div>
  </header>

  <main class="container">
    <div class="list-header">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 0.25rem;">My List</h1>
        <p style="color: var(--text-secondary);" id="listCount">Titles saved to your personal queue.</p>
      </div>
      <button class="btn btn-outline" id="clearListBtn" style="font-size: 0.88rem; padding: 0.5rem 1.25rem;">Clear Entire List</button>
    </div>

    <div class="watchlist-grid" id="watchlistGrid">
      <!-- Injected by inline controller -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-disclaimer">
        StreamFlix saves your personal watchlist securely in browser LocalStorage.
      </div>
    </div>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/discovery.js"></script>
  <script src="./js/videoSources.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profiles.js"></script>
  <script src="./js/watchlist.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/recommendations.js"></script>
  <script src="./js/app.js"></script>

  <script>
    function renderList() {
      const list = WatchlistService.getList();
      const grid = document.getElementById('watchlistGrid');
      const countEl = document.getElementById('listCount');

      countEl.textContent = `${list.length} title${list.length === 1 ? '' : 's'} saved to your queue`;

      if (!list || list.length === 0) {
        grid.innerHTML = `
          <div class="state-container" style="grid-column: 1 / -1;">
            <div class="state-icon">📋</div>
            <h2 class="state-title">Your List is Empty</h2>
            <p class="state-text">Explore movies and series and press '+ My List' on any card to save titles here.</p>
            <a href="index.html" class="btn btn-primary">Discover Titles</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(item => App.createMovieCard(item)).join('');
    }

    document.getElementById('clearListBtn').onclick = () => {
      if (confirm('Are you sure you want to clear your entire watchlist?')) {
        WatchlistService.clear();
        renderList();
      }
    };

    window.addEventListener('DOMContentLoaded', renderList);
  </script>
</body>
</html>
