<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Titles - STREAMFLIX</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    .search-hero {
      padding-top: calc(var(--header-height) + 2rem);
      padding-bottom: 2rem;
      background: linear-gradient(180deg, rgba(229, 9, 20, 0.08) 0%, rgba(20, 20, 20, 0) 100%);
    }
    .search-input-group {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      padding: 0.4rem 0.75rem 0.4rem 1.5rem;
      max-width: 760px;
      margin: 0 auto;
      box-shadow: var(--shadow-md);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-input-group:focus-within {
      border-color: var(--accent-red);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .search-input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.15rem;
      padding: 0.6rem 0;
      font-family: inherit;
    }
    .search-filter-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .search-filter-tab {
      padding: 0.45rem 1.25rem;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .search-filter-tab:hover,
    .search-filter-tab.active {
      background: var(--accent-red);
      color: #fff;
    }
    .search-chips-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }
    .search-chip {
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .search-chip:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 3.5rem 0 2rem;
    }
    .pagination-info {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .btn.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand-logo">
        <svg class="logo-icon" viewBox="0 0 24 24"><path d="M4 2v20l16-10L4 2z"/></svg>
        STREAM<span>FLIX</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="my-list.html">My List</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <button class="nav-kids-badge">KIDS</button>
      <div class="nav-profile-wrapper">
        <div class="profile-avatar-btn">
          <div class="profile-avatar-img"></div>
        </div>
        <div class="profile-dropdown">
          <a href="profiles.html" class="profile-dropdown-item">Profiles</a>
          <a href="settings.html" class="profile-dropdown-item">Settings</a>
          <div class="profile-dropdown-divider"></div>
          <button class="profile-dropdown-item" onclick="AuthService.logout()">Sign Out</button>
        </div>
      </div>
      <div class="mobile-menu-btn"><span></span><span></span><span></span></div>
    </div>
  </header>

  <!-- Search Input Bar -->
  <section class="search-hero">
    <div class="container">
      <div class="search-input-group">
        <input 
          type="search" 
          id="searchInput" 
          class="search-input-field" 
          placeholder="Search by movie title, series, or keyword..." 
          autocomplete="off" 
          autofocus
        />
        <button class="btn btn-accent" id="searchBtn" style="border-radius: var(--radius-full); padding: 0.6rem 1.5rem;">
          Search
        </button>
      </div>

      <!-- Filter tabs -->
      <div class="search-filter-tabs">
        <button class="search-filter-tab active" data-type="all">All Titles</button>
        <button class="search-filter-tab" data-type="movie">Movies Only</button>
        <button class="search-filter-tab" data-type="series">TV Series Only</button>
      </div>

      <!-- Recent searches chips -->
      <div id="recentSearchesSection" style="margin-top: 1.25rem; text-align: center;">
        <span style="font-size: 0.8rem; color: var(--text-muted); margin-right: 0.5rem;">Recent searches:</span>
        <div class="search-chips-row" id="recentSearchesChips" style="display: inline-flex;"></div>
        <button id="clearRecentSearchesBtn" style="font-size: 0.75rem; color: var(--text-muted); text-decoration: underline; margin-left: 0.5rem; cursor: pointer;">Clear</button>
      </div>
    </div>
  </section>

  <!-- Results Grid -->
  <main class="container" style="padding-bottom: 5rem;">
    <div class="results-grid" id="searchResultsGrid">
      <!-- Search results injected by search.js -->
    </div>

    <!-- Pagination Container -->
    <div id="paginationContainer"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-disclaimer">
        StreamFlix search connects securely to OMDb API through the Spring Boot proxy.
      </div>
    </div>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/cache.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/discovery.js"></script>
  <script src="./js/videoSources.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profiles.js"></script>
  <script src="./js/watchlist.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/recommendations.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/search.js"></script>
</body>
</html>
