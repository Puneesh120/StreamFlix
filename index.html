<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=frontend/index.html" />
  <title>STREAMFLIX - Streaming Web Platform</title>
  <link rel="icon" type="image/svg+xml" href="frontend/assets/images/favicon.svg" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #E50914;
      margin-bottom: 1.5rem;
    }
    .logo span {
      color: #fff;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(229, 9, 20, 0.2);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #E50914;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    window.location.replace("frontend/index.html");
  </script>
</head>
<body>
  <div class="logo">STREAM<span>FLIX</span></div>
  <div class="spinner"></div>
  <p>Launching STREAMFLIX... <br><br>If you are not redirected automatically, <a href="frontend/index.html">click here</a>.</p>
</body>
</html>
